<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none" aria-label="Creator Connect Logo">
  <defs>
    <linearGradient id="cc-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="cc-spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="cc-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Section (64x64 at 8, 8) -->
  <g transform="translate(8, 8) scale(0.64)">
    <circle cx="50" cy="50" r="42" fill="url(#cc-logo-grad)" opacity="0.14" filter="url(#cc-logo-glow)" />

    <path
      d="M 68 24
         C 40 18, 16 34, 16 52
         C 16 70, 40 84, 68 78"
      stroke="url(#cc-logo-grad)"
      stroke-width="12"
      stroke-linecap="round"
    />

    <path
      d="M 68 34
         C 52 38, 38 46, 38 52
         C 38 58, 52 64, 68 68"
      stroke="url(#cc-logo-grad)"
      stroke-width="6"
      stroke-linecap="round"
      opacity="0.6"
    />

    <circle cx="70" cy="24" r="11" fill="url(#cc-logo-grad)" />
    <circle cx="70" cy="24" r="5" fill="#FFFFFF" />

    <circle cx="70" cy="78" r="11" fill="url(#cc-logo-grad)" />
    <circle cx="70" cy="78" r="5" fill="#FFFFFF" />

    <g transform="translate(48, 51)">
      <path
        d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z"
        fill="url(#cc-spark-grad)"
        filter="url(#cc-logo-glow)"
      />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: Creator Connect -->
  <g transform="translate(82, 45)">
    <text font-family="'Sora', 'Figtree', system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#0F172A" letter-spacing="-0.5px">Creator<tspan fill="url(#cc-logo-grad)" font-weight="800">Connect</tspan></text>
  </g>

  <!-- Tagline -->
  <g transform="translate(84, 61)">
    <text font-family="'Figtree', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.8px">MEET CREATORS IN PERSON</text>
  </g>
</svg>
